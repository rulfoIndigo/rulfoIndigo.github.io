<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Indigo Rulfo | CFX Demo Reel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(92%, 1200px);
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
    }

    .role {
      margin-top: 10px;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #bdbdbd;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .details {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #2c2c2c;
    }

    .details h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .details p {
      margin: 0;
      color: #bdbdbd;
      line-height: 1.6;
      font-size: 16px;
    }

    footer {
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid #2c2c2c;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <h1>INDIGO RULFO</h1>
      <div class="role">CFX ARTIST</div>
    </header>

    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/KnLd-GCV9Y4?rel=0"
        title="Indigo Rulfo CFX Demo Reel"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <section class="details">
      <h2>CFX DEMO REEL — 2026</h2>
      <p>
        Character FX · Cloth Simulation · Rigging
      </p>
    </section>

    <footer>
      Indigo Rulfo — CFX / Rigging
    </footer>

  </main>

</body>
</html>
